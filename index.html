<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sympt'mes">
  <meta name="robots" content="noindex, nofollow">
  <title>Sympt'mes</title>
  <meta name="description" content="Ton axolotl à nourrir chaque jour, des compliments, et des jeux anti-stress.">
  <!-- Aperçu quand on partage le lien (Messages, WhatsApp…) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sympt'mes : ton axolotl et tes jeux anti-stress">
  <meta property="og:description" content="Un axolotl qui grandit avec toi et te fait des compliments, le jeu des tubes et ses boss… et d’autres jeux à venir.">
  <meta property="og:url" content="https://khylianb.github.io/sympt-mes/">
  <meta property="og:image" content="https://khylianb.github.io/sympt-mes/img/apercu.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://khylianb.github.io/sympt-mes/img/apercu.jpg?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="login" hidden>
    <div class="login-box">
      <img src="icons/icon-192.png" alt="" width="72" height="72">
      <h1>Sympt'mes</h1>
      <p class="muted">Ton axolotl et tes jeux anti-stress</p>
      <h2 id="login-title" class="login-title"></h2>
      <form id="login-form">
        <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
        <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" minlength="6" required>
        <input id="login-password2" type="password" placeholder="Confirme le mot de passe" autocomplete="new-password" minlength="6" hidden>
        <button id="login-btn" class="btn primary big" type="submit">Se connecter</button>
      </form>
      <div id="login-links" class="login-links"></div>
      <p id="login-msg" class="muted small"></p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div id="header-main" class="header-main"></div>
      <button id="sync-status" class="sync-pill" aria-label="État de la synchronisation"></button>
    </header>

    <main>
      <p id="demo-banner" class="demo-banner" hidden>Mode démo · rien n’est envoyé en ligne</p>
      <section id="view-pet" class="view"></section>
      <section id="view-games" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>


    <nav class="tabbar">
      <button data-tab="pet" class="on"><span>🩷</span><b id="tab-pet-label">Axolotl</b></button>
      <button data-tab="games"><span>🎮</span>Jeux</button>
      <button data-tab="settings"><span>⚙️</span>Réglages</button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-panel"><div class="sheet-grip"></div><div id="sheet-body"></div></div>
  </div>
  <div id="update-banner" class="update-banner" role="status" hidden>
    <div class="ub-head">
      <span id="update-title">✨ Nouvelle version</span>
      <button id="update-btn" class="btn primary small">Mettre à jour</button>
    </div>
    <div id="update-notes"></div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
