<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf4f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sympt'mes">
  <meta name="robots" content="noindex, nofollow">
  <title>Sympt'mes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="login" hidden>
    <div class="login-box">
      <img src="icons/icon-192.png" alt="" width="72" height="72">
      <h1>Sympt'mes</h1>
      <p class="muted">Suivi quotidien des symptômes</p>
      <form id="login-form">
        <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
        <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
        <button id="login-btn" class="btn primary big" type="submit">Se connecter</button>
      </form>
      <p id="login-msg" class="muted small"></p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div id="header-main" class="header-main"></div>
      <button id="sync-status" class="sync-pill" aria-label="État de la synchronisation"></button>
    </header>

    <main>
      <p id="demo-banner" class="demo-banner" hidden>Mode démo · rien n’est envoyé en ligne</p>
      <section id="view-home" class="view"></section>
      <section id="view-today" class="view" hidden></section>
      <section id="view-summary" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>


    <nav class="tabbar">
      <button data-tab="home" class="on"><span>🏠</span>Accueil</button>
      <button data-tab="today"><span>✏️</span>Saisie</button>
      <button data-tab="summary"><span>📈</span>Synthèse</button>
      <button data-tab="settings"><span>⚙️</span>Réglages</button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-panel"><div class="sheet-grip"></div><div id="sheet-body"></div></div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
